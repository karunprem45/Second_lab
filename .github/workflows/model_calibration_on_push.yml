name: Model Calibration

on:
  workflow_run:
    workflows: ["Model Retraining on Push"]
    types: [completed]

permissions:
  contents: write

jobs:
  calibrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main (includes the new model)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calibrate latest model
        run: python src/calibrate_model.py

      - name: Commit and push calibrated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ metrics/
          git commit -m "Add calibrated model" || echo "Nothing to commit"
          git pull --rebase origin main
          git push origin main
